[versions]
agp = "9.0.1"
kotlin = "2.3.10"
coreKtx = "1.17.0"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
lifecycleRuntimeKtx = "2.10.0"
activityCompose = "1.12.4"
composeBom = "2026.02.00"
google-fonts = "1.10.3"
material3-expressive = "1.5.0-alpha14"
material-icons = "1.7.8"
material-icons-extended = "1.7.8"
kotlinx-datetime = "0.7.1-0.6.x-compat"
kotlinx-serialization-json = "1.10.0"
kotlin-serialization = "2.3.10"
koin = "4.1.1"
nav3Core = "1.0.1"
lifecycleViewmodelNav3 = "2.10.0"
kotlinxSerializationCore = "1.10.0"
material3AdaptiveNav3 = "1.3.0-alpha08"
roomDatabase = "2.8.4"
ksp = "2.3.4"
charts = "0.2.5"


[libraries]
# Kotlin
kotlinx-date-time = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlinx-datetime"}
kotlinx-sterialization-json = {module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization-json"}

# Android
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-material3-expressive = {module = "androidx.compose.material3:material3-android", version.ref = "material3-expressive"}
androidx-compose-material-icons = { module = "androidx.compose.material:material-icons-core", version.ref = "material-icons"}
androidx-compose-material-icons-extended = { module = "androidx.compose.material:material-icons-extended", version.ref = "material-icons-extended"}
androidx-compose-ui-text = { module = "androidx.compose.ui:ui-text-google-fonts", version.ref = "google-fonts" }

# Navigation 3
# Core Navigation 3 libraries
androidx-navigation3-runtime = { module = "androidx.navigation3:navigation3-runtime", version.ref = "nav3Core" }
androidx-navigation3-ui = { module = "androidx.navigation3:navigation3-ui", version.ref = "nav3Core" }
androidx-lifecycle-viewmodel-navigation3 = { module = "androidx.lifecycle:lifecycle-viewmodel-navigation3", version.ref = "lifecycleViewmodelNav3" }
kotlinx-serialization-core = { module = "org.jetbrains.kotlinx:kotlinx-serialization-core", version.ref = "kotlinxSerializationCore" }
androidx-material3-adaptive-navigation3 = { group = "androidx.compose.material3.adaptive", name = "adaptive-navigation3", version.ref = "material3AdaptiveNav3" }

# Room database
androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "roomDatabase" }
androidx-room-runtime = { module = "androidx.room:room-runtime", version.ref = "roomDatabase" }
androidx-room-ktx = { module = "androidx.room:room-ktx", version.ref = "roomDatabase" }
androidx-room-rxjava2 = { module = "androidx.room:room-rxjava2", version.ref = "roomDatabase" }
androidx-room-rxjava3 = { module = "androidx.room:room-rxjava3", version.ref = "roomDatabase" }
androidx-room-guava = { module = "androidx.room:room-guava", version.ref = "roomDatabase" }
androidx-room-testing = { module = "androidx.room:room-testing", version.ref = "roomDatabase" }
androidx-room-paging = { module = "androidx.room:room-paging", version.ref = "roomDatabase" }

# Koin
koin-android = { module = "io.insert-koin:koin-android", version.ref = "koin" }
koin-androidx-compose = { module = "io.insert-koin:koin-androidx-compose", version.ref = "koin" }

# Charts
compose-charts = { module = "io.github.ehsannarmani:compose-charts", version.ref = "charts" }

# KSP

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
jetbrains-kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin-serialization" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }

